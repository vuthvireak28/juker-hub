<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juker Jork | Links</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(0, 153, 255, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 0, 150, 0.28), transparent 35%),
        linear-gradient(135deg, #020617, #07162f, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 45px 45px;
      animation: moveGrid 18s linear infinite;
      z-index: -3;
    }

    @keyframes moveGrid {
      from { transform: translateY(0); }
      to { transform: translateY(45px); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(25px);
      opacity: 0.7;
      z-index: -2;
      animation: float 6s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 180px;
      height: 180px;
      background: #00b7ff;
      top: 12%;
      left: 12%;
    }

    .orb.two {
      width: 220px;
      height: 220px;
      background: #ff007a;
      right: 10%;
      bottom: 10%;
      animation-delay: 1.3s;
    }

    .orb.three {
      width: 130px;
      height: 130px;
      background: #7c3aed;
      right: 25%;
      top: 18%;
      animation-delay: 0.7s;
    }

    @keyframes float {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-35px) scale(1.08); }
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 34px 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: popIn 0.8s ease forwards;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(120deg, transparent, rgba(0, 195, 255, 0.45), transparent);
      transform: translateX(-100%);
      animation: shine 4s infinite;
      z-index: -1;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      45%, 100% { transform: translateX(100%); }
    }

    .avatar {
      width: 115px;
      height: 115px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background:
        linear-gradient(135deg, #00c6ff, #7c3aed, #ff007a);
      padding: 4px;
      animation: glowPulse 2.5s infinite ease-in-out;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #061126;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -4px;
    }

    @keyframes glowPulse {
      0%, 100% {
        box-shadow: 0 0 18px rgba(0, 195, 255, 0.55);
      }
      50% {
        box-shadow: 0 0 40px rgba(255, 0, 122, 0.75);
      }
    }

    h1 {
      font-size: 34px;
      letter-spacing: 1px;
      margin-bottom: 7px;
      text-shadow: 0 0 18px rgba(0, 195, 255, 0.7);
    }

    .tagline {
      font-size: 15px;
      color: #cbd5e1;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .type {
      color: #67e8f9;
      font-weight: 700;
    }

    .links {
      display: grid;
      gap: 15px;
      margin-top: 10px;
    }

    .link-btn {
      text-decoration: none;
      color: #fff;
      padding: 15px 17px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .link-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 80%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transition: 0.5s;
    }

    .link-btn:hover::after {
      left: 120%;
    }

    .link-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.08);
      flex: 0 0 auto;
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .yt-icon {
      background: linear-gradient(135deg, rgba(255,0,0,0.95), rgba(155,0,35,0.95));
      box-shadow: 0 0 22px rgba(255, 0, 0, 0.35);
    }

    .fb-icon {
      background: linear-gradient(135deg, rgba(24,119,242,0.95), rgba(29,78,216,0.95));
      box-shadow: 0 0 22px rgba(24, 119, 242, 0.35);
    }

    .tt-icon {
      background: linear-gradient(135deg, rgba(17,24,39,0.98), rgba(236,72,153,0.85));
      box-shadow: 0 0 22px rgba(236, 72, 153, 0.35);
    }

    .youtube:hover {
      background: linear-gradient(135deg, #ff0033, #9f1239);
    }

    .facebook:hover {
      background: linear-gradient(135deg, #1877f2, #1d4ed8);
    }

    .tiktok:hover {
      background: linear-gradient(135deg, #111827, #ec4899);
    }

    .arrow {
      font-size: 20px;
      opacity: 0.8;
      transition: transform 0.25s ease;
    }

    .link-btn:hover .arrow {
      transform: translateX(5px);
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #94a3b8;
    }

    .live-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 7px;
      box-shadow: 0 0 12px #22c55e;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (max-width: 430px) {
      h1 {
        font-size: 29px;
      }

      .card {
        padding: 28px 18px;
      }

      .link-btn {
        padding: 13px 14px;
      }

      .brand-icon {
        width: 45px;
        height: 45px;
        border-radius: 15px;
      }
    }
  </style>
</head>
